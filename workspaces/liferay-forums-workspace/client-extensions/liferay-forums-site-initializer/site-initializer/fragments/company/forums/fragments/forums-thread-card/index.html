<div class="card forums-message-card forums-thread-card">
	<div class="card-body">
		<div class="autofit-row">
			<div class="autofit-col forums-message-card__avatar-col">
				<span class="sticker sticker-circle sticker-lg">
					<span class="sticker-overlay">
						<img alt="" class="sticker-img" data-lfr-editable-id="avatar" data-lfr-editable-type="image" src="" />
					</span>
				</span>

				<div class="forums-message-card__username text-secondary text-truncate" data-lfr-editable-id="author" data-lfr-editable-type="text">
					Author
				</div>
			</div>

			<div class="autofit-col autofit-col-expand forums-message-card__content">
				<h5 class="card-title forums-message-card__title">
					<a data-lfr-editable-id="title" data-lfr-editable-type="link" href="#">Thread Title</a>
				</h5>

				<p class="forums-message-card__preview text-secondary" data-lfr-editable-id="preview" data-lfr-editable-type="text">
					Thread preview
				</p>

				<div class="forums-message-card__meta text-secondary small">
					<span class="forums-message-card__meta-item" data-lfr-editable-id="date" data-lfr-editable-type="text">Date</span>
				</div>
			</div>
		</div>
	</div>
</div>
