assemble:
    -   fromTask: bootJar
liferay-forums-etc-spring-boot-oahs:
    .serviceAddress: localhost:58081
    .serviceScheme: http
    name: Liferay Forums Etc Spring Boot OAuth Application Headless Server
    scopes:
        -   Liferay.Headless.Admin.Site.everything.read
        -   Liferay.Headless.Admin.User.everything.read
        -   Liferay.Notification.REST.everything
        -   Liferay.Object.Admin.REST.everything.read
        -   c_c2m0ban.everything.read
        -   c_c2m0message.everything
        -   c_c2m0suspiciousactivity.everything
        -   c_c2m0thread.everything
        -   c_c2m0user.everything
        -   c_c2m0vote.everything.read
    type: oAuthApplicationHeadlessServer
    userAccountScreenName: default-service-account
liferay-forums-etc-spring-boot-oaua:
    .serviceAddress: localhost:58081
    .serviceScheme: http
    name: Liferay Forums Etc Spring Boot OAuth Application User Agent
    scopes:
        -   c_c2m0suspiciousactivity.everything.read
        -   c_c2m0thread.everything.read
    type: oAuthApplicationUserAgent
liferay-forums-etc-spring-boot-object-action-handle-suspicious-activity-update:
    name: Liferay Forums Etc Spring Boot Object Action Handle Suspicious Activity Update
    oAuth2ApplicationExternalReferenceCode: liferay-forums-etc-spring-boot-oaua
    resourcePath: /object-action/handle-suspicious-activity-update
    type: objectAction
liferay-forums-etc-spring-boot-object-action-new-reply:
    name: Liferay Forums Etc Spring Boot Object Action New Reply
    oAuth2ApplicationExternalReferenceCode: liferay-forums-etc-spring-boot-oaua
