#
# Settings for running this microservice on a self-hosted server. Edit the
# four values below, then run start.sh (Linux/macOS) or start.bat (Windows)
# from this directory. Anything set here overrides the defaults in the jar.
#

#
# Host and port of your Liferay instance, as the browser sees it, and whether
# it is served over http or https.
#

com.liferay.lxc.dxp.mainDomain=localhost:8080
com.liferay.lxc.dxp.server.protocol=http

#
# Client ID and client secret of "Liferay Forums Etc Spring Boot OAuth
# Application Headless Server", from Control Panel > Security > OAuth 2
# Administration. The OAuth application appears once the client extension zip
# is deployed to Liferay.
#

liferay-forums-etc-spring-boot-oahs.oauth2.headless.server.client.id=
liferay-forums-etc-spring-boot-oahs.oauth2.headless.server.client.secret=

#
# Port this microservice listens on. It must match the .serviceAddress in the
# deployed client extension, which is where Liferay sends the object actions.
#

server.port=58081